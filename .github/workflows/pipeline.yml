name: CI

on: [push, pull_request]

permissions:
  contents: read
  id-token: write   # necessario para OIDC (aws-actions/configure-aws-credentials)

jobs:

  unit-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r src/requirements.txt -r src/test-requirements.txt
    - name: Run tests
      env:
        JWT_SECRET: test-secret-not-for-real-use
        DYNAMODB_TABLE_NAME: Customers-test
      run: |
        pytest --cov=lambda_function --cov-report=xml --cov-report=term --cov-fail-under=85 src/tests/

  code-analisys:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r src/requirements.txt -r src/test-requirements.txt
    - name: Run Pylint
      run: pylint lambda_function.py --fail-under=9.5
    - name: Run Bandit (SAST)
      run: bandit -r . --exclude ./.git,./src/tests -ll
    - name: Run pip-audit (dependency vulnerabilities)
      run: pip-audit -r src/requirements.txt

  # Resolve o ambiente alvo a partir do gatilho: develop->dev, main->hom, tag v*->prod.
  resolve-env:
    runs-on: ubuntu-latest
    needs: code-analisys
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
    steps:
      - id: resolve
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "environment=prod" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=hom" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "environment=dev" >> "$GITHUB_OUTPUT"
          else
            echo "environment=" >> "$GITHUB_OUTPUT"
          fi

  publish:
    if: needs.resolve-env.outputs.environment != ''
    runs-on: ubuntu-latest
    needs: resolve-env
    environment: ${{ needs.resolve-env.outputs.environment }}
    outputs:
      image_tag: ${{ steps.image.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-pos_tech_fiap_lambda
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push the image to Amazon ECR
        id: image
        run: |
          IMAGE_TAG="sha-${{ github.sha }}"
          docker build -t "${{ steps.login-ecr.outputs.registry }}/jlapp-lambda:${IMAGE_TAG}" .
          docker push "${{ steps.login-ecr.outputs.registry }}/jlapp-lambda:${IMAGE_TAG}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

  # dev: fast-path direto na Lambda, sem esperar terraform apply - agilidade de iteracao.
  deploy-dev-fastpath:
    if: needs.resolve-env.outputs.environment == 'dev'
    needs: [resolve-env, publish]
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-pos_tech_fiap_lambda
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update AWS Lambda function (fast-path dev)
        run: |
          aws lambda update-function-code \
            --function-name jlapp-lambda-cliente-dev \
            --image-uri ${{ steps.login-ecr.outputs.registry }}/jlapp-lambda:${{ needs.publish.outputs.image_tag }}

  # hom/prod: deploy via Terraform (pos_tech_fiap_lambda_terraform), evita drift
  # entre a imagem atualizada direto na Lambda e o image_uri gerenciado pelo state.
  deploy-via-terraform:
    if: needs.resolve-env.outputs.environment == 'hom' || needs.resolve-env.outputs.environment == 'prod'
    needs: [resolve-env, publish]
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-env.outputs.environment }}
    steps:
      - name: Checkout pos_tech_fiap_lambda_terraform
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/pos_tech_fiap_lambda_terraform
          path: infra

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-pos_tech_fiap_lambda_terraform
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform apply
        working-directory: infra
        run: |
          ENV="${{ needs.resolve-env.outputs.environment }}"
          terraform init -backend-config="envs/${ENV}-backend.hcl"
          terraform workspace select -or-create "$ENV"
          terraform apply -auto-approve \
            -var-file="envs/${ENV}.tfvars" \
            -var="imagem_name=jlapp-lambda:${{ needs.publish.outputs.image_tag }}"
